services:
  dev:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules 
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    # Добавляем --host для связи с Windows и --port для фиксации порта
    command: sh -c "npm install && npx vite --host 0.0.0.0 --port 3000"